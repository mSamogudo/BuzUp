<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminais BusUp — última posição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #mapa { position: absolute; inset: 0; }
  .bz-pin {
    width: 30px; height: 30px; border-radius: 999px; border: 2px solid #FFFFFF;
    box-shadow: 0 4px 12px rgba(13,59,102,.28);
  }
  .bz-tip { font: 500 12px/1.5 Inter, system-ui, sans-serif; color: #0F1B2D; }
  .bz-tip b { font: 500 12.5px/1.4 "IBM Plex Mono", monospace; display: block; margin-bottom: 3px; }
  .bz-tip small { font: 400 11.5px/1.5 Inter, system-ui, sans-serif; color: #5B6B7F; display: block; }
  .leaflet-container { background: #E7EDF5; font-family: Inter, system-ui, sans-serif; }
</style>
</head>
<body>
<div id="mapa"></div>
<script>
  var TERMINAIS = [
    { id: "POS-004", kind: "POS",       status: "active",  where: "Balcão Junta",        speed: "0 km/h",  ping: "há 2 min",   v: "1.4.2", lat: -25.8912, lng: 32.5541 },
    { id: "POS-011", kind: "POS",       status: "active",  where: "AAB-14-MP · L1",      speed: "38 km/h", ping: "há 12 s",    v: "1.4.2", lat: -25.8452, lng: 32.5620 },
    { id: "VAL-007", kind: "Validador", status: "active",  where: "ABC-27-MC · L3",      speed: "52 km/h", ping: "há 8 s",     v: "1.4.0", lat: -25.9231, lng: 32.4407 },
    { id: "VAL-012", kind: "Validador", status: "active",  where: "AAD-56-MP · L5",      speed: "0 km/h",  ping: "há 1 min",   v: "1.4.2", lat: -25.9208, lng: 32.5726 },
    { id: "POS-019", kind: "POS",       status: "pending", where: "por activar · Matola", speed: "—",      ping: "há 3 h",     v: "1.3.9", lat: -25.9622, lng: 32.4589 },
    { id: "VAL-021", kind: "Validador", status: "blocked", where: "ADX-77-MC · L2",      speed: "—",       ping: "há 2 dias",  v: "1.3.4", lat: -25.9182, lng: 32.6115 },
    { id: "POS-023", kind: "POS",       status: "active",  where: "Balcão Baixa",        speed: "0 km/h",  ping: "há 40 s",    v: "1.4.2", lat: -25.9689, lng: 32.5731 }
  ];
  var COR = { active: "#2D8CF0", pending: "#C8821A", blocked: "#8E2A19" };
  var ESTADO = { active: "Activo", pending: "Pendente", blocked: "Bloqueado" };

  var filtro = new URLSearchParams(location.search).get("f") || "";
  var visiveis = TERMINAIS.filter(function (t) { return !filtro || t.status === filtro; });

  var mapa = L.map("mapa", { zoomControl: true }).setView([-25.9692, 32.5732], 12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors",
    maxZoom: 18
  }).addTo(mapa);

  visiveis.forEach(function (t) {
    var icone = L.divIcon({
      html: '<div class="bz-pin" style="background:' + COR[t.status] + '"></div>',
      iconSize: [30, 30],
      iconAnchor: [15, 15],
      className: ""
    });
    L.marker([t.lat, t.lng], { icon: icone, title: t.id })
      .addTo(mapa)
      .bindPopup(
        '<span class="bz-tip"><b>' + t.id + "</b>" +
        t.kind + " · " + ESTADO[t.status] + "<small>" + t.where + "</small>" +
        "<small>" + t.speed + " · " + t.ping + " · app " + t.v + "</small></span>"
      );
  });

  if (visiveis.length > 1) {
    mapa.fitBounds(visiveis.map(function (t) { return [t.lat, t.lng]; }), { padding: [56, 56] });
  } else if (visiveis.length === 1) {
    mapa.setView([visiveis[0].lat, visiveis[0].lng], 14);
  }
</script>
</body>
</html>
