events {}

http {
  include /etc/nginx/mime.types;
  sendfile on;

  # APK release uploads via the portal go through /api/ — the default 1m body
  # limit would 413 them. Allow up to 60M.
  client_max_body_size 60M;

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  # Tecto por IP antes de o pedido chegar ao Django. O throttle do DRF ja
  # existe, mas consome uma thread e uma ligacao a base de dados para dizer
  # "nao"; aqui a recusa custa quase nada. Generoso de proposito — um terminal
  # em hora de ponta faz muitos pedidos legitimos — e com burst para nao cortar
  # rajadas normais de navegacao.
  limit_req_zone $binary_remote_addr zone=buzup_api:10m rate=20r/s;
  limit_req_status 429;

  # DNS do Docker, resolvido A CADA PEDIDO (via variavel no proxy_pass).
  #
  # Com `upstream { server nome; }` o nginx resolve o nome UMA VEZ, ao carregar
  # a configuracao, e guarda o IP para sempre. Basta recriar o contentor do
  # frontend ou do backend — um simples `up -d` depois de um build — para o IP
  # mudar e o gateway ficar a bater num endereco que ja nao existe: 502 em tudo
  # ate alguem reparar e recarregar o nginx a mao. Foi o que aconteceu num
  # deploy do portal.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  server {
    listen 80;
    server_name _;

    # TLS termina no edge partilhado; manter Location relativo para nao
    # redirecionar para http:// nos links curtos (/baixar, /pos, ...).
    absolute_redirect off;

    location = /healthz {
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    location /api/ {
      set $backend_up http://buzup_backend:8000;
      proxy_pass $backend_up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;

      # Explícitos em vez do default de 60s, e coerentes com a cadeia:
      # gateway de pagamento 25s < nginx 75s < gunicorn 120s. Assim quem
      # devolve o erro é sempre a camada de dentro, que sabe o que aconteceu,
      # em vez de o nginx cortar às cegas e o agente repetir uma operação que
      # ainda estava a decorrer.
      proxy_connect_timeout 10s;
      proxy_send_timeout 75s;
      proxy_read_timeout 75s;

      # Uma resposta grande não pode ficar a ocupar memória do nginx à espera
      # de um cliente móvel lento.
      proxy_buffering on;

      limit_req zone=buzup_api burst=40 nodelay;
    }

    location /admin/ {
      set $backend_up http://buzup_backend:8000;
      proxy_pass $backend_up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /static/ {
      alias /var/www/backend-static/;
    }

    location /media/ {
      alias /var/www/backend-media/;
    }

    # Entrega de ficheiros grandes (APKs) delegada ao nginx.
    #
    # Servidos pelo Django, os 40 MB de um APK prendiam um worker do gunicorn
    # durante todo o download e eram cortados ao fim do `--timeout` (120s)
    # numa ligação fraca — o telefone recebia meio ficheiro. `internal` faz
    # com que este caminho só seja alcançável através do cabeçalho
    # X-Accel-Redirect que a vista devolve depois de validar a permissão;
    # ninguém lhe chega escrevendo o URL.
    location /protected-media/ {
      internal;
      alias /var/www/backend-media/;

      # Downloads retomáveis: numa rede móvel instável, uma quebra continua
      # de onde parou em vez de recomeçar os 40 MB. O `Accept-Ranges` é posto
      # pelo próprio nginx ao servir um ficheiro — não o repetir aqui.
      sendfile on;
      tcp_nopush on;
    }

    # Links de download amigaveis (partilhaveis): /pos e /passageiro descarregam
    # sempre a ultima versao publicada. A pagina /baixar e servida pela SPA
    # (React DownloadPage) via location / abaixo; /api/baixar/ mantem-se como
    # fallback HTML sem JavaScript.
    location = /pos { return 302 /api/apps/pos/download/; }
    location = /passageiro { return 302 /api/apps/passageiro/download/; }

    location / {
      set $frontend_up http://buzup_frontend:80;
      proxy_pass $frontend_up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }
}
